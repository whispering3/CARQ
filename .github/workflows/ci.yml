name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy type check
        run: mypy src/carq --ignore-missing-imports

  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: carq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CARQ_ENVIRONMENT: development
      CARQ_DEBUG: "false"
      CARQ_DB_HOST: localhost
      CARQ_DB_PORT: "5432"
      CARQ_DB_USER: postgres
      CARQ_DB_PASSWORD: testpass
      CARQ_DB_DATABASE: carq_test
      CARQ_REDIS_ENABLED: "true"
      CARQ_REDIS_HOST: localhost
      CARQ_REDIS_PORT: "6379"
      CARQ_API_JWT_SECRET: test-jwt-secret-not-for-production
      CARQ_EMBEDDING_OPENAI_API_KEY: sk-test-fake-key
      CARQ_LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ \
            --cov=src/carq \
            --cov-report=xml \
            --cov-report=term-missing \
            -q \
            -m "not slow"

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ \
            --cov=src/carq \
            --cov-append \
            --cov-report=xml \
            -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Bandit SAST scan
        run: bandit -r src/carq -ll -x src/carq/tests

      - name: pip-audit dependency scan
        run: pip-audit --requirement <(pip freeze) --ignore-vuln GHSA-p5w8-wqhj-9hhf

      - name: Trivy vulnerability scan (container image)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"

  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ─────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://carq-staging.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: Update API image
        run: |
          kubectl set image deployment/carq-api \
            carq=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n carq
          kubectl rollout status deployment/carq-api -n carq --timeout=300s

      - name: Update Worker image
        run: |
          kubectl set image deployment/carq-worker \
            carq-worker=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n carq
          kubectl rollout status deployment/carq-worker -n carq --timeout=300s

      - name: Smoke test
        run: |
          sleep 10
          kubectl run smoke-test --rm -i --restart=Never \
            --image=curlimages/curl:latest \
            -n carq \
            -- curl -sf http://carq-api-svc/health/live

  # ─────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://carq.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > $HOME/.kube/config

      - name: Update API image
        run: |
          kubectl set image deployment/carq-api \
            carq=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n carq
          kubectl rollout status deployment/carq-api -n carq --timeout=300s

      - name: Update Worker image
        run: |
          kubectl set image deployment/carq-worker \
            carq-worker=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n carq
          kubectl rollout status deployment/carq-worker -n carq --timeout=300s

      - name: Verify deployment health
        run: |
          sleep 15
          kubectl get pods -n carq -l app=carq
          kubectl run smoke-test --rm -i --restart=Never \
            --image=curlimages/curl:latest \
            -n carq \
            -- curl -sf http://carq-api-svc/health/ready
