# IMPORTANT: This file is a template. All values must be base64-encoded.
# To encode a value: echo -n "your-value" | base64
# DO NOT commit real secrets to version control.
# Use a secrets manager (Vault, AWS Secrets Manager, Sealed Secrets) in production.
apiVersion: v1
kind: Secret
metadata:
  name: carq-secret
  namespace: carq
  labels:
    app.kubernetes.io/name: carq
    app.kubernetes.io/component: secret
type: Opaque
data:
  # PostgreSQL password
  # echo -n "your-db-password" | base64
  CARQ_DB_PASSWORD: <base64-encoded-db-password>

  # PostgreSQL user
  # echo -n "postgres" | base64
  CARQ_DB_USER: <base64-encoded-db-user>

  # Redis password (leave empty string if no auth: echo -n "" | base64 → "")
  # echo -n "your-redis-password" | base64
  CARQ_REDIS_PASSWORD: <base64-encoded-redis-password>

  # OpenAI API key
  # echo -n "sk-..." | base64
  CARQ_EMBEDDING_OPENAI_API_KEY: <base64-encoded-openai-api-key>

  # JWT signing secret (generate: python -c "import secrets; print(secrets.token_urlsafe(64))")
  # echo -n "your-jwt-secret" | base64
  CARQ_API_JWT_SECRET: <base64-encoded-jwt-secret>
