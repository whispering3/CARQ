[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carq"
version = "0.1.0"
description = "Fila de Processamento RAG com Consciência de Contexto - Orquestrador Empresarial de Ingestão RAG"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Danilo", email = "danilo@example.com"}
]

dependencies = [
    # Principal
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",

    # Banco de dados
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.12,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "pgvector>=0.2,<1.0",

    # Async e Concorrência
    "aiohttp>=3.9,<4.0",
    "redis>=5.0,<6.0",
    "tenacity>=8.2,<10.0",

    # Framework Web
    "fastapi>=0.104,<1.0",
    "uvicorn[standard]>=0.24,<1.0",
    "python-multipart>=0.0.6,<1.0",
    "pyjwt>=2.8,<3.0",

    # Processamento de PDF
    "pypdf>=3.17,<5.0",
    "pdfplumber>=0.10,<1.0",

    # Embeddings
    "openai>=1.0,<2.0",

    # Monitoramento
    "prometheus-client>=0.19,<1.0",

    # Logs
    "python-json-logger>=2.0,<4.0",

    # Utilitários
    "pydantic-core>=2.0,<3.0",
    "httpx>=0.25,<1.0",
    "click>=8.1,<9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.6",
    "factory-boy>=3.3",
    "faker>=20.0",
]

test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "testcontainers>=3.7",
]

docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
]

[project.urls]
Repository = "https://github.com/whispering3/CARQ"
Issues = "https://github.com/whispering3/CARQ/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",      # erros do pycodestyle
    "W",      # avisos do pycodestyle
    "F",      # Pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
]
ignore = [
    "E501",   # linha muito longa
    "B008",   # não executar chamadas de função nos padrões de argumento
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
addopts = "--strict-markers -ra"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow tests",
]

[tool.coverage.run]
source = ["src/carq"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
