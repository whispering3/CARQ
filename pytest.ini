[pytest]
# Pytest configuration for CARQ

pythonpath = src

testpaths = tests
python_files = test_*.py *_test.py load_test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Markers for test categorization
markers =
    unit: Unit tests (isolated components)
    integration: Integration tests (requires PostgreSQL)
    slow: Slow running tests (load tests, long-running integrations)
    db: Tests that require database access

# Coverage settings
addopts =
    --strict-markers
    -ra
    --tb=short

# Doctest
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS
